<svg width="100%" viewBox="0 0 680 240" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Alex Curtis — Welcome to my GitHub</title>
  <desc>Retro techy banner with ASCII border, dot grid, coral and mint palette, and pixel lettering.</desc>
 
  <defs>
