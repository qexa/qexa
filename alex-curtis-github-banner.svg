      <stop offset="55%" stop-color="#7FFFD4" stop-opacity="0"/>
      <stop offset="100%" stop-color="#7FFFD4" stop-opacity="0"/>
    </linearGradient>
    <pattern id="dots" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="0" cy="0" r="1" fill="#FF6B9D"/>
    </pattern>
